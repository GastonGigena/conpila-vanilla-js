<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="keywords" content="ConPila, perfil usuario, profile, comunidad, red social, tecnología, desarrollo de software, programación" />
  <meta name="description" content="Perfil de usuario en ConPila. Descubre las publicaciones, intereses y actividad de los miembros de la comunidad tecnológica." />

  <link rel="icon" href="images/iconoconpila.ico" type="image/x-icon" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />

  <script>
    (function() {
      document.documentElement.classList.add('no-transition');
      var t = localStorage.getItem('theme') || localStorage.getItem('conpila_theme');
      if (t === 'light') document.documentElement.classList.add('light');
    })();
  </script>

  <title>Perfil de Usuario - ConPila | Red social para entusiastas de la tecnología</title>
</head>

<body class="own-container components">

  <!-- Header Superior -->
  <header class="header" id="grid-header">
    <div class="theme-toggle-container">
      <button id="mode" class="cp-theme-toggle" aria-label="Cambiar tema claro/oscuro">
        <div class="cp-toggle-track">
          <i class="fa-solid fa-bolt cp-toggle-icon"></i>
        </div>
      </button>
    </div>

    <div class="header-logo logo">
      <a href="home.html">
        <img class="header-logo-img" src="images/logo_horizontal.png" alt="Logo ConPila" />
      </a>
    </div>

    <div class="menu-container dropdown">
      <button class="menu" type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menú de usuario">
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </button>

      <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end" aria-labelledby="dropdownMenuButton1">
        <li>
          <a class="dropdown-item" href="terms-and-conditions.html">
            <i class="fa-solid fa-file-contract me-2"></i> Términos y condiciones
          </a>
        </li>
        <li><hr class="dropdown-divider border-secondary"></li>
        <li>
          <a class="dropdown-item action-logout text-danger" href="index.html">
            <i class="fa-solid fa-right-from-bracket me-2"></i> Cerrar sesión
          </a>
        </li>
      </ul>
    </div>
  </header>

  <!-- Barra de Navegación Lateral (Desktop) / Inferior (Móvil) -->
  <nav class="nav-bar" id="grid-navbar" aria-label="Navegación principal">
    <ul class="nav-bar-list">
      <li>
        <a href="home.html">
          <i class="fa-solid fa-house"></i>
          <span class="navbar-text">Inicio</span>
        </a>
      </li>
      <li>
        <a href="contacts.html">
          <i class="fa-solid fa-users"></i>
          <span class="navbar-text">Contactos</span>
        </a>
      </li>
      <li class="active">
        <a href="profile.html">
          <img class="profile-avatar avatar-navbar" src="images/user-solid.png" alt="Foto de perfil de usuario" />
          <span class="navbar-text">Mi perfil</span>
        </a>
      </li>
      <li>
        <a href="home.html#post-search-container" id="nav-search-btn" title="Buscar publicaciones">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span class="navbar-text">Buscar</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Contenido Principal: Perfil y Publicaciones -->
  <main class="container-components" id="grid-main">
    <section class="profile-header" id="grid-section-user-info">
      <!-- Carga vía JS -->
    </section>

    <!-- Panel Lateral Derecho con Botón de Publicar y Banner de Seguidores -->
    <section class="followers" id="grid-section-followers">
      <button class="new-post" id="hidden-new-post" data-bs-toggle="modal" data-bs-target="#createPostModal">
        CREAR PUBLICACIÓN
      </button>

      <ul class="followers-banner">
        <li>
          <a class="followers-counter" href="contacts.html">
            <span class="number-of-followers">
              <i class="fa-solid fa-user"></i> 0
            </span>
            <span class="label-followers">seguidos</span>
          </a>
        </li>
        <li>
          <a class="followers-counter" href="contacts.html">
            <span class="number-of-followers">
              <i class="fa-solid fa-user"></i> 0
            </span>
            <span class="label-followers">seguidores</span>
          </a>
        </li>
      </ul>
    </section>

    <!-- Lista de Publicaciones del Usuario -->
    <section class="posts" id="grid-section-user-posts" aria-label="Publicaciones del perfil">
      <!-- Carga vía JS -->
    </section>
  </main>

  <!-- Modal Bootstrap para Editar Perfil -->
  <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-md modal-dialog-centered">
      <div class="modal-content cp-modal-box p-4 rounded-3">
        <div class="modal-header border-0 pb-0 flex-column align-items-start position-relative">
          <h2 class="modal-title h5 fw-bold m-0 text-uppercase" id="editProfileModalLabel">
            Editar Mi Perfil
          </h2>
          <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-1" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body px-0 pb-0">
          <form id="editProfileForm">
            <!-- Selector de Avatar con Previsualización -->
            <div class="mb-3 text-center">
              <label class="form-label text-muted small d-block mb-2">Foto de perfil (haz clic para cambiar)</label>
              <div class="d-inline-block position-relative" id="edit-avatar-trigger" style="cursor: pointer;" title="Haz clic para seleccionar nueva foto">
                <img id="edit-avatar-preview" src="images/user-solid.png" class="profile-avatar avatar-profile" alt="Previsualización de foto de perfil" style="width: 110px; height: 110px; object-fit: cover; border: 3px solid var(--cp-green);" />
                <span class="position-absolute bottom-0 end-0 bg-success text-dark p-2 rounded-circle shadow" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; transform: translate(15%, 15%); background-color: var(--cp-green) !important; color: var(--cp-black) !important;">
                  <i class="fa-solid fa-camera"></i>
                </span>
                <input type="file" id="edit-avatar-file" accept="image/*" style="display: none;" />
              </div>
            </div>
            <div class="mb-3">
              <label for="edit-name-input" class="form-label text-muted small">Nombre y Apellido</label>
              <input type="text" id="edit-name-input" class="form-control cp-input p-3 rounded-2" placeholder="Tu nombre y apellido" required />
            </div>
            <div class="mb-3">
              <label for="edit-bio-input" class="form-label text-muted small">Biografía</label>
              <textarea id="edit-bio-input" class="form-control cp-input p-3 rounded-2" placeholder="Escribe tu biografía o intereses en tecnología..." rows="4"></textarea>
            </div>
            <button type="submit" class="btn cp-btn-submit w-100 fw-bold py-3 rounded-2 mt-2">
              GUARDAR CAMBIOS
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Bootstrap para Crear Publicación -->
  <div class="modal fade" id="createPostModal" tabindex="-1" aria-labelledby="createPostModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-md modal-dialog-centered">
      <div class="modal-content cp-modal-box p-4 rounded-3">
        <div class="modal-header border-0 pb-0 flex-column align-items-start position-relative">
          <h2 class="modal-title h5 fw-bold m-0 text-uppercase" id="createPostModalLabel">
            Crear nueva publicación
          </h2>
          <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-1" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body px-0 pb-0">
          <div class="mb-3">
            <label for="post-title-input" class="form-label text-muted small">Título de la publicación</label>
            <input type="text" id="post-title-input" class="form-control cp-input p-3 rounded-2" placeholder="Escribe tu título" required />
          </div>

          <div class="mb-3">
            <label for="post-body-input" class="form-label text-muted small">Contenido</label>
            <textarea id="post-body-input" class="form-control cp-input p-3 rounded-2" placeholder="¿Qué quieres compartir?" rows="5" required></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small">Adjuntar Imagen (Opcional)</label>
            <div class="d-flex align-items-center gap-2">
              <input type="file" id="file-upload" class="form-control cp-input" accept="image/*" />
            </div>
            <div id="preview-container" class="d-none mt-3 text-center"></div>
          </div>

          <button type="button" class="btn cp-btn-submit w-100 fw-bold py-3 rounded-2 mt-2">
            PUBLICAR
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/profilePresentation.js"></script>
  <script src="js/mode.js"></script>
</body>

</html>
